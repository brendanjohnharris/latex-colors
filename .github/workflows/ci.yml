name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - name: Package without warnings
        run: |
          npx vsce package 2>&1 | tee vsce.log
          ! grep -q WARNING vsce.log
