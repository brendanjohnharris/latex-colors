name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        vscode: [stable, insiders]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - uses: TeX-Live/setup-texlive-action@v4 # pdflatex for the probe tests
        with:
          packages: |
            scheme-basic
            xcolor
            infwarerr
            soul
            ulem
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run bench -- --max 100
      - run: xvfb-run -a npm run test:vscode
        env:
          VSCODE_VERSION: ${{ matrix.vscode }}
      - name: Package without warnings
        run: |
          npx vsce package 2>&1 | tee vsce.log
          ! grep -q WARNING vsce.log
